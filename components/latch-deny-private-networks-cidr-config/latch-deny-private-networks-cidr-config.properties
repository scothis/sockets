# Address ranges that are not globally reachable, from the IANA IPv4 and IPv6 special-purpose
# address registries, and IPv6 ranges that reach IPv4 hosts through translation or tunneling.

# IPv4

# "this network", connecting to 0.0.0.0 may reach the local host
deny-ipv4-this-network=0.0.0.0/8
# private use
deny-ipv4-private-10=10.0.0.0/8
deny-ipv4-private-172=172.16.0.0/12
deny-ipv4-private-192=192.168.0.0/16
# shared address space, carrier grade NAT
deny-ipv4-shared=100.64.0.0/10
# loopback
deny-ipv4-loopback=127.0.0.0/8
# link local, includes cloud metadata endpoints like 169.254.169.254
deny-ipv4-link-local=169.254.0.0/16
# IETF protocol assignments
deny-ipv4-ietf=192.0.0.0/24
# documentation
deny-ipv4-documentation-1=192.0.2.0/24
deny-ipv4-documentation-2=198.51.100.0/24
deny-ipv4-documentation-3=203.0.113.0/24
# 6to4 relay anycast, deprecated
deny-ipv4-6to4-relay=192.88.99.0/24
# benchmarking
deny-ipv4-benchmarking=198.18.0.0/15
# multicast
deny-ipv4-multicast=224.0.0.0/4
# reserved, includes the limited broadcast address 255.255.255.255
deny-ipv4-reserved=240.0.0.0/4

# IPv6, IPv4-mapped addresses (::ffff:0:0/96) are matched by the IPv4 ranges

# unspecified, loopback and deprecated IPv4-compatible addresses
deny-ipv6-ipv4-compatible=::/96
# NAT64, reaches IPv4 hosts
deny-ipv6-nat64=64:ff9b::/96
deny-ipv6-nat64-local=64:ff9b:1::/48
# discard only
deny-ipv6-discard=100::/64
# IETF protocol assignments, includes Teredo (2001::/32) which reaches IPv4 hosts
deny-ipv6-ietf=2001::/23
# documentation
deny-ipv6-documentation-1=2001:db8::/32
deny-ipv6-documentation-2=3fff::/20
# 6to4, reaches IPv4 hosts
deny-ipv6-6to4=2002::/16
# unique local, includes cloud metadata endpoints like fd00:ec2::254
deny-ipv6-unique-local=fc00::/7
# link local
deny-ipv6-link-local=fe80::/10
# site local, deprecated
deny-ipv6-site-local=fec0::/10
# multicast
deny-ipv6-multicast=ff00::/8
